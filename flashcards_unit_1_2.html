<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Phonics World 2 • Units 1 & 2 Flashcards (Short a)</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-gradient: linear-gradient(135deg, #ffe4e6 0%, #ccfbf1 50%, #bae6fd 100%);
  --primary: #0f766e;
  --accent: #e11d48;
  --text-dark: #1e293b;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Nunito', system-ui, sans-serif;
  background: var(--bg-gradient);
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column; align-items: center;
  padding: 16px 14px 40px; color: var(--text-dark);
  position: relative; overflow-x: hidden;
}
.bg-critter {
  position: fixed; pointer-events: none; user-select: none; opacity: 0.28; z-index: 0;
  animation: floatSlow 6s ease-in-out infinite;
}
.c1 { top: 5%; left: 4%; font-size: 4rem; }
.c2 { top: 12%; right: 5%; font-size: 3.8rem; animation-delay: 1.5s; }
.c3 { bottom: 10%; left: 5%; font-size: 4rem; animation-delay: 3s; }
.c4 { bottom: 8%; right: 4%; font-size: 4.4rem; animation-delay: 2s; }
@keyframes floatSlow { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }

.wrap { position: relative; z-index: 1; width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; }
.badge { background: #fff; color: var(--accent); font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 0.8rem; padding: 4px 14px; border-radius: 999px; box-shadow: 0 4px 10px rgba(225,29,72,0.15); margin-bottom: 6px; }
h1 { font-family: 'Fredoka', sans-serif; font-size: clamp(1.4rem, 5vw, 1.85rem); color: var(--primary); text-align: center; margin-bottom: 10px; }

.top-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; width: 100%; margin-bottom: 10px; }
.mode-btn, .save-file-btn {
  border: none; border-radius: 12px; padding: 9px 14px; font-family: 'Fredoka', sans-serif;
  font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
}
.mode-btn { background: rgba(255,255,255,0.85); color: #475569; }
.mode-btn.active { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(15,118,110,0.28); }
.save-file-btn { background: #e11d48; color: #fff; box-shadow: 0 4px 12px rgba(225,29,72,0.28); }
.save-file-btn:hover { background: #be123c; }

.progress-row { display: flex; align-items: center; gap: 10px; width: 100%; margin-bottom: 12px; }
.p-bar { flex: 1; height: 9px; background: rgba(255,255,255,0.65); border-radius: 999px; overflow: hidden; }
.p-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.3s ease; }
.p-count { font-weight: 800; font-size: 0.85rem; color: var(--primary); min-width: 54px; text-align: right; }

/* 3D Flashcard: Picture Front, Word Back */
.scene { width: 100%; height: 375px; perspective: 1200px; cursor: pointer; user-select: none; }
.card { width: 100%; height: 100%; position: relative; transition: transform 0.6s cubic-bezier(0.34,1.56,0.64,1); transform-style: preserve-3d; }
.card.is-flipped { transform: rotateY(180deg); }
.face {
  position: absolute; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: 26px; padding: 18px; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  text-align: center; box-shadow: 0 18px 36px rgba(15,118,110,0.18); background: rgba(255,255,255,0.96); border: 3px solid #99f6e4;
}
.face-back { transform: rotateY(180deg); background: linear-gradient(135deg, #0f172a, #1e293b); color: #fff; border-color: #5eead4; justify-content: center; gap: 14px; }
.front-top { width: 100%; display: flex; justify-content: space-between; align-items: center; }
.fam-tag { background: #ffe4e6; color: var(--accent); font-family: 'Fredoka', sans-serif; font-size: 0.85rem; font-weight: 700; padding: 4px 12px; border-radius: 999px; }
.tap-note { font-size: 0.76rem; color: #64748b; font-weight: 700; }

.pic-box {
  width: 205px; height: 205px; border-radius: 22px; background: #f8fafc;
  border: 2.5px dashed #5eead4; display: flex; flex-direction: column; align-items: center; justify-content: center;
  overflow: hidden; margin: auto;
}
.pic-box img { width: 100%; height: 100%; object-fit: cover; }
.pic-placeholder { font-size: 4.5rem; line-height: 1; }
.pic-hint { font-size: 0.75rem; color: #64748b; margin-top: 6px; font-weight: 600; }

.word-big { font-family: 'Fredoka', sans-serif; font-size: clamp(2.6rem, 11vw, 3.6rem); font-weight: 700; color: #5eead4; letter-spacing: 1px; }
.btn-small {
  border: none; border-radius: 999px; padding: 9px 16px; font-family: 'Fredoka', sans-serif;
  font-size: 0.9rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
}
.btn-listen { background: #0f766e; color: #fff; border: 2px solid #5eead4; }
.btn-upload { background: #e11d48; color: #fff; box-shadow: 0 4px 10px rgba(225,29,72,0.25); }

.nav-row { display: flex; gap: 10px; width: 100%; margin-top: 14px; }
.nav-btn { flex: 1; background: #fff; border: 2px solid #99f6e4; border-radius: 14px; padding: 12px; font-family: 'Fredoka', sans-serif; font-size: 1rem; font-weight: 700; color: var(--primary); cursor: pointer; }
.nav-btn:active { transform: scale(0.97); }
/* Test Mode */
.hidden { display: none !important; }
.quiz-box {
  width: 100%; background: rgba(255,255,255,0.96); border: 3px solid #99f6e4;
  border-radius: 26px; padding: 20px 18px; box-shadow: 0 18px 36px rgba(15,118,110,0.18); text-align: center;
}
.style-switch { display: flex; background: #f1f5f9; padding: 4px; border-radius: 12px; gap: 4px; margin-bottom: 12px; }
.style-btn { flex: 1; border: none; background: transparent; padding: 8px; border-radius: 9px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 0.88rem; color: #64748b; cursor: pointer; }
.style-btn.active { background: var(--primary); color: #fff; }
.score-strip { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 800; color: var(--primary); margin-bottom: 10px; }
.quiz-pic {
  width: 165px; height: 165px; margin: 0 auto 10px; border-radius: 20px; background: #f8fafc;
  border: 2.5px solid #cbd5e1; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 4.2rem;
}
.quiz-pic img { width: 100%; height: 100%; object-fit: cover; }

.mcq-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.mcq-opt {
  background: #fff; border: 2px solid #cbd5e1; border-bottom: 4px solid #94a3b8; border-radius: 14px;
  padding: 12px 8px; font-family: 'Fredoka', sans-serif; font-size: 1.25rem; font-weight: 700; color: var(--text-dark); cursor: pointer;
}
.mcq-opt.ok { background: #dcfce7; border-color: #16a34a; color: #15803d; }
.mcq-opt.err { background: #fee2e2; border-color: #dc2626; color: #b91c1c; }

/* Unscramble Tiles */
.unscramble-slots {
  min-height: 54px; background: #f0fdfa; border: 2px dashed var(--primary); border-radius: 14px;
  padding: 8px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 12px;
}
.letter-pool { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; margin-bottom: 10px; }
.l-tile {
  min-width: 42px; height: 46px; background: #fff; border: 2px solid #94a3b8; border-bottom: 4px solid #64748b;
  border-radius: 11px; font-family: 'Fredoka', sans-serif; font-size: 1.35rem; font-weight: 700; color: var(--text-dark);
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; padding: 0 8px;
}
.l-tile.placed { background: #ffe4e6; border-color: var(--accent); color: var(--accent); }
.l-tile.used { opacity: 0.3; pointer-events: none; }

.fb-msg { min-height: 28px; font-weight: 800; font-size: 0.95rem; margin: 8px 0; }
.next-q-btn { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 14px; padding: 12px; font-family: 'Fredoka', sans-serif; font-size: 1.05rem; font-weight: 700; cursor: pointer; }
@media (max-width: 480px) { .scene { height: 355px; } .pic-box { width: 180px; height: 180px; } }
</style>
</head>
<body>

  <div class="bg-critter c1">🧜‍♀️</div>
  <div class="bg-critter c2">🐬</div>
  <div class="bg-critter c3">🐚</div>
  <div class="bg-critter c4">🦀</div>

  <div class="wrap">
    <div class="badge">Oxford Phonics World 2 • Units 1 &amp; 2</div>
    <h1>🧜‍♀️ Short a Flashcards &amp; Test</h1>

    <div class="top-bar">
      <button type="button" class="mode-btn active" id="btnCardsMode">🃏 Flashcards (23)</button>
      <button type="button" class="mode-btn" id="btnTestMode">🎯 Test Mode</button>
      <button type="button" class="save-file-btn" id="btnSavePermanent">💾 Save Permanent File</button>
    </div>

    <div class="progress-row">
      <div class="p-bar"><div class="p-fill" id="pFill"></div></div>
      <div class="p-count" id="pCount">1 / 23</div>
    </div>

    <!-- FLASHCARDS VIEW: Picture Front, Word Back -->
    <div id="cardsView" style="width:100%">
      <div class="scene" id="cardScene">
        <div class="card" id="flashcard">
          <div class="face face-front">
            <div class="front-top">
              <span class="fam-tag" id="famTag">-a-</span>
              <span class="tap-note">👆 Tap to see word</span>
            </div>
            <div class="pic-box" id="picBox">
              <div class="pic-placeholder">🐜</div>
              <div class="pic-hint">Tap below to upload picture</div>
            </div>
            <button type="button" class="btn-small btn-upload" id="btnUploadTrigger">📷 Upload Picture</button>
            <input type="file" id="picInput" accept="image/*" class="hidden">
          </div>
          <div class="face face-back">
            <div style="font-size:0.82rem;text-transform:uppercase;letter-spacing:1.5px;color:#94a3b8;font-weight:700">Phonics Word</div>
            <div class="word-big" id="wordBack">ant</div>
            <button type="button" class="btn-small btn-listen" id="btnListenBack">🔊 Listen</button>
            <div class="tap-note" style="color:#94a3b8">👆 Tap to flip back</div>
          </div>
        </div>
      </div>
      <div class="nav-row">
        <button type="button" class="nav-btn" id="btnPrev">← Prev</button>
        <button type="button" class="nav-btn" id="btnShuffle">🔀</button>
        <button type="button" class="nav-btn" id="btnNext">Next →</button>
      </div>
    </div>

    <!-- TEST VIEW -->
    <div id="testView" class="quiz-box hidden">
      <div class="style-switch">
        <button type="button" class="style-btn active" id="btnStyle1">🖼️ Style 1: Choose Word</button>
        <button type="button" class="style-btn" id="btnStyle2">🔤 Style 2: Unscramble</button>
      </div>
      <div class="score-strip">
        <span id="qScore">Score: 0</span>
        <span id="qStep">Question 1 / 23</span>
      </div>
      <div class="quiz-pic" id="quizPic">🐜</div>
      <div style="margin-bottom: 12px;">
        <button type="button" class="btn-small btn-upload" id="btnTestUpload">📷 Upload Picture</button>
      </div>
      <div id="style1Area" class="mcq-grid"></div>
      <div id="style2Area" class="hidden">
        <div class="unscramble-slots" id="uSlots"></div>
        <div class="letter-pool" id="uPool"></div>
      </div>
      <div class="fb-msg" id="fbMsg"></div>
      <button type="button" class="next-q-btn" id="btnNextQ">Check / Next →</button>
    </div>
  </div>
<script id="deck-data-script">
let cardsData = [
  { word: "ant", fam: "-a-", icon: "🐜", img: "" },
  { word: "ax", fam: "-a-", icon: "🪓", img: "" },
  { word: "alligator", fam: "-a-", icon: "🐊", img: "" },
  { word: "ram", fam: "-am", icon: "🐏", img: "" },
  { word: "jam", fam: "-am", icon: "🍓", img: "" },
  { word: "yam", fam: "-am", icon: "🍠", img: "" },
  { word: "dam", fam: "-am", icon: "🌊", img: "" },
  { word: "fan", fam: "-an", icon: "🪭", img: "" },
  { word: "man", fam: "-an", icon: "👨", img: "" },
  { word: "pan", fam: "-an", icon: "🍳", img: "" },
  { word: "can", fam: "-an", icon: "🥫", img: "" },
  { word: "dad", fam: "-ad", icon: "👨‍👦", img: "" },
  { word: "pad", fam: "-ad", icon: "📝", img: "" },
  { word: "bag", fam: "-ag", icon: "🎒", img: "" },
  { word: "rag", fam: "-ag", icon: "🧽", img: "" },
  { word: "cap", fam: "-ap", icon: "🧢", img: "" },
  { word: "map", fam: "-ap", icon: "🗺️", img: "" },
  { word: "nap", fam: "-ap", icon: "😴", img: "" },
  { word: "tap", fam: "-ap", icon: "🚰", img: "" },
  { word: "bat", fam: "-at", icon: "🦇", img: "" },
  { word: "cat", fam: "-at", icon: "🐱", img: "" },
  { word: "hat", fam: "-at", icon: "🎩", img: "" },
  { word: "mat", fam: "-at", icon: "🧘", img: "" }
];
</script>
<script>
let idx = 0, flipped = false;
let testDeck = [], qIdx = 0, score = 0, testStyle = 1, qAnswered = false;
let uploadTargetWord = "";

function speakUK(word) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-GB';
  u.rate = 0.92;
  u.pitch = 1.0;
  const voices = window.speechSynthesis.getVoices();
  const uk = voices.find(v => (v.lang === 'en-GB' || v.lang === 'en_GB') && /Google UK English|Daniel|Serena|Kate|Natural/i.test(v.name)) ||
             voices.find(v => v.lang === 'en-GB' || v.lang === 'en_GB');
  if (uk) u.voice = uk;
  window.speechSynthesis.speak(u);
}
if ('speechSynthesis' in window && window.speechSynthesis.onvoiceschanged !== undefined) {
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

function renderCard() {
  const c = cardsData[idx];
  document.getElementById('famTag').textContent = c.fam;
  document.getElementById('wordBack').textContent = c.word;
  const picBox = document.getElementById('picBox');
  if (c.img) {
    picBox.innerHTML = `<img src="${c.img}" alt="${c.word}">`;
  } else {
    picBox.innerHTML = `<div class="pic-placeholder">${c.icon}</div><div class="pic-hint">Tap below to upload picture</div>`;
  }
  document.getElementById('pCount').textContent = `${idx + 1} / ${cardsData.length}`;
  document.getElementById('pFill').style.width = `${((idx + 1) / cardsData.length) * 100}%`;
}

document.getElementById('cardScene').addEventListener('click', () => {
  flipped = !flipped;
  document.getElementById('flashcard').classList.toggle('is-flipped', flipped);
  if (flipped) speakUK(cardsData[idx].word);
});

document.getElementById('btnListenBack').addEventListener('click', (e) => {
  e.stopPropagation();
  speakUK(cardsData[idx].word);
});

document.getElementById('btnUploadTrigger').addEventListener('click', (e) => {
  e.stopPropagation();
  uploadTargetWord = cardsData[idx].word;
  document.getElementById('picInput').click();
});

document.getElementById('btnTestUpload').addEventListener('click', (e) => {
  e.stopPropagation();
  uploadTargetWord = testDeck[qIdx].word;
  document.getElementById('picInput').click();
});

document.getElementById('picInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const imgObj = new Image();
    imgObj.onload = () => {
      const canvas = document.createElement('canvas');
      const maxDim = 420;
      let w = imgObj.width, h = imgObj.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(imgObj, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.82);

      const cardItem = cardsData.find(c => c.word === uploadTargetWord);
      if (cardItem) cardItem.img = dataUrl;
      const testItem = testDeck.find(c => c.word === uploadTargetWord);
      if (testItem) testItem.img = dataUrl;

      renderCard();
      if (!document.getElementById('testView').classList.contains('hidden')) {
        document.getElementById('quizPic').innerHTML = `<img src="${dataUrl}" alt="clue">`;
      }
    };
    imgObj.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = "";
});

// Save Permanent Self-Contained HTML File with Uploaded Pictures Baked In
document.getElementById('btnSavePermanent').addEventListener('click', () => {
  const clone = document.documentElement.cloneNode(true);
  clone.querySelector('#flashcard').classList.remove('is-flipped');
  clone.querySelector('#cardsView').classList.remove('hidden');
  clone.querySelector('#testView').classList.add('hidden');
  clone.querySelector('#btnCardsMode').classList.add('active');
  clone.querySelector('#btnTestMode').classList.remove('active');
  clone.querySelector('#deck-data-script').textContent = `\nlet cardsData = ${JSON.stringify(cardsData, null, 2)};\n`;
  const htmlOut = "<!DOCTYPE html>\n" + clone.outerHTML;
  const blob = new Blob([htmlOut], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "Phonics_World_2_Units_1_2_Short_a_Saved.html";
  a.click();
  URL.revokeObjectURL(a.href);
});
function shuffleArr(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

document.getElementById('btnPrev').addEventListener('click', () => {
  flipped = false;
  document.getElementById('flashcard').classList.remove('is-flipped');
  setTimeout(() => { idx = (idx - 1 + cardsData.length) % cardsData.length; renderCard(); }, 150);
});

document.getElementById('btnNext').addEventListener('click', () => {
  flipped = false;
  document.getElementById('flashcard').classList.remove('is-flipped');
  setTimeout(() => { idx = (idx + 1) % cardsData.length; renderCard(); }, 150);
});

document.getElementById('btnShuffle').addEventListener('click', () => {
  cardsData = shuffleArr(cardsData);
  idx = 0; flipped = false;
  document.getElementById('flashcard').classList.remove('is-flipped');
  renderCard();
});

// Switch between Flashcards & Test Mode
document.getElementById('btnCardsMode').addEventListener('click', () => {
  document.getElementById('btnCardsMode').classList.add('active');
  document.getElementById('btnTestMode').classList.remove('active');
  document.getElementById('cardsView').classList.remove('hidden');
  document.getElementById('testView').classList.add('hidden');
  renderCard();
});

document.getElementById('btnTestMode').addEventListener('click', () => {
  document.getElementById('btnTestMode').classList.add('active');
  document.getElementById('btnCardsMode').classList.remove('active');
  document.getElementById('cardsView').classList.add('hidden');
  document.getElementById('testView').classList.remove('hidden');
  startTest();
});

document.getElementById('btnStyle1').addEventListener('click', () => {
  testStyle = 1;
  document.getElementById('btnStyle1').classList.add('active');
  document.getElementById('btnStyle2').classList.remove('active');
  startTest();
});

document.getElementById('btnStyle2').addEventListener('click', () => {
  testStyle = 2;
  document.getElementById('btnStyle2').classList.add('active');
  document.getElementById('btnStyle1').classList.remove('active');
  startTest();
});

function startTest() {
  testDeck = shuffleArr(cardsData);
  qIdx = 0; score = 0;
  renderQuestion();
}

function renderQuestion() {
  const item = testDeck[qIdx];
  qAnswered = false;
  document.getElementById('qScore').textContent = `Score: ${score}`;
  document.getElementById('qStep').textContent = `Question ${qIdx + 1} / ${testDeck.length}`;
  document.getElementById('pCount').textContent = `${qIdx + 1} / ${testDeck.length}`;
  document.getElementById('pFill').style.width = `${((qIdx + 1) / testDeck.length) * 100}%`;
  document.getElementById('fbMsg').textContent = "";

  const qPic = document.getElementById('quizPic');
  qPic.innerHTML = item.img ? `<img src="${item.img}" alt="clue">` : item.icon;

  const s1 = document.getElementById('style1Area');
  const s2 = document.getElementById('style2Area');

  if (testStyle === 1) {
    s1.classList.remove('hidden');
    s2.classList.add('hidden');
    document.getElementById('btnNextQ').textContent = "Skip →";

    const distractors = shuffleArr(cardsData.filter(c => c.word !== item.word)).slice(0, 3);
    const options = shuffleArr([item, ...distractors]);
    s1.innerHTML = "";
    options.forEach(opt => {
      const b = document.createElement('button');
      b.type = "button";
      b.className = "mcq-opt";
      b.textContent = opt.word;
      b.onclick = () => {
        if (qAnswered) return;
        qAnswered = true;
        speakUK(item.word);
        s1.querySelectorAll('.mcq-opt').forEach(btn => {
          btn.disabled = true;
          if (btn.textContent === item.word) btn.classList.add('ok');
        });
        if (opt.word === item.word) {
          score++;
          document.getElementById('fbMsg').style.color = "#15803d";
          document.getElementById('fbMsg').textContent = `✨ Great job! "${item.word}"`;
        } else {
          b.classList.add('err');
          document.getElementById('fbMsg').style.color = "#b91c1c";
          document.getElementById('fbMsg').textContent = `❌ Correct word: ${item.word}`;
        }
        document.getElementById('qScore').textContent = `Score: ${score}`;
        document.getElementById('btnNextQ').textContent = qIdx < testDeck.length - 1 ? "Next →" : "Restart Test 🔄";
      };
      s1.appendChild(b);
    });
  } else {
    s1.classList.add('hidden');
    s2.classList.remove('hidden');
    document.getElementById('btnNextQ').textContent = "Check Answer ✓";

    const slots = document.getElementById('uSlots');
    const pool = document.getElementById('uPool');
    slots.innerHTML = "";
    pool.innerHTML = "";

    let letters = item.word.split('').map((ch, i) => ({ ch, i }));
    letters = shuffleArr(letters);
    if (letters.map(x => x.ch).join('') === item.word && item.word.length > 1) {
      letters.reverse();
    }

    letters.forEach(obj => {
      const tile = document.createElement('span');
      tile.className = "l-tile";
      tile.textContent = obj.ch;
      tile.onclick = () => {
        if (qAnswered || tile.classList.contains('used')) return;
        tile.classList.add('used');
        const placed = document.createElement('span');
        placed.className = "l-tile placed";
        placed.textContent = obj.ch;
        placed.onclick = () => {
          if (qAnswered) return;
          placed.remove();
          tile.classList.remove('used');
        };
        slots.appendChild(placed);
      };
      pool.appendChild(tile);
    });
  }
}

document.getElementById('btnNextQ').addEventListener('click', () => {
  const item = testDeck[qIdx];
  if (testStyle === 2 && !qAnswered) {
    const built = Array.from(document.querySelectorAll('#uSlots .l-tile')).map(t => t.textContent).join('');
    if (!built) return;
    qAnswered = true;
    speakUK(item.word);
    if (built === item.word) {
      score++;
      document.getElementById('fbMsg').style.color = "#15803d";
      document.getElementById('fbMsg').textContent = `✨ Awesome! "${item.word}"`;
    } else {
      document.getElementById('fbMsg').style.color = "#b91c1c";
      document.getElementById('fbMsg').textContent = `❌ Correct spelling: ${item.word}`;
    }
    document.getElementById('qScore').textContent = `Score: ${score}`;
    document.getElementById('btnNextQ').textContent = qIdx < testDeck.length - 1 ? "Next →" : "Restart Test 🔄";
    return;
  }

  if (qIdx < testDeck.length - 1) {
    qIdx++;
    renderQuestion();
  } else {
    startTest();
  }
});

renderCard();
</script>
